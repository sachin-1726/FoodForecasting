name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./FoodForecastingAPI/FoodForecastingAPI/FoodForecastingAPI.csproj

      - name: Build backend
        run: dotnet build ./FoodForecastingAPI/FoodForecastingAPI/FoodForecastingAPI.csproj --no-restore --configuration Release