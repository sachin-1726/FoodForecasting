name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: food-forecasting-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./food-forecasting-ui
        run: npm ci

      - name: Build Angular application
        working-directory: ./food-forecasting-ui
        run: npm run build